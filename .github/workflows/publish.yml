name: Publish

# The publish job. Triggered only by version tags (v0.1.0, v0.2.0, ...), so a
# release is a deliberate act: bump <Version> in src/SharpDb/SharpDb.csproj,
# commit, tag, push the tag.
#
# One run produces every distribution artifact the project ships:
#   1. The NuGet package (the global tool) — pushed to nuget.org via trusted
#      publishing: no stored API key, a short-lived OIDC token instead.
#   2. Self-contained single-file executables for the platforms the README's
#      audience runs — attached to a GitHub Release alongside the .nupkg.
#
# Kept separate from build.yml on purpose: CI runs on every push and PR with
# read-only permissions; this workflow runs rarely and needs id-token + write.
on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  publish:
    name: Publish to NuGet and create release
    runs-on: ubuntu-latest
    # Matches the nuget.org trusted publishing policy and scopes NUGET_USER.
    environment: release
    permissions:
      id-token: write   # OIDC token for NuGet trusted publishing
      contents: write   # creating the GitHub Release

    steps:
      - uses: actions/checkout@v4

      # Same SDK pin as build.yml: .slnx resolution needs 9.0.200 or newer.
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.200

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # The tag is the published version number, so it must equal the version
      # the .nupkg was built with — otherwise the release page and nuget.org
      # would disagree about what version this is.
      - name: Validate version matches project
        run: |
          PROJECT_VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/SharpDb/SharpDb.csproj)
          if [ "$PROJECT_VERSION" != "${{ steps.version.outputs.VERSION }}" ]; then
            echo "::error::Tag v${{ steps.version.outputs.VERSION }} does not match project Version $PROJECT_VERSION"
            exit 1
          fi

      - name: Test
        run: dotnet test SharpDb.slnx -c Release

      - name: Pack
        run: dotnet pack src/SharpDb/SharpDb.csproj -c Release -o ./artifacts

      # Self-contained single-file executables: no .NET runtime needed on the
      # target machine. Native libraries (e_sqlite3) ride along via self-extract.
      # The LICENSE travels inside each archive: GPL-3.0 requires that whoever
      # receives the program also receives the licence text.
      - name: Publish self-contained executables
        run: |
          for rid in win-x64 linux-x64 linux-arm64 osx-x64 osx-arm64; do
            dotnet publish src/SharpDb/SharpDb.csproj -c Release -r "$rid" \
              --self-contained true \
              -p:PublishSingleFile=true \
              -p:IncludeNativeLibrariesForSelfExtract=true \
              -o "artifacts/exe/$rid"
            cp LICENSE "artifacts/exe/$rid/"
          done

      - name: Archive executables
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          for rid in win-x64 linux-x64 linux-arm64 osx-x64 osx-arm64; do
            if [ "$rid" = "win-x64" ]; then
              (cd "artifacts/exe/$rid" && zip -qr "../../sharpdb-mcp-$VERSION-$rid.zip" .)
            else
              (cd "artifacts/exe/$rid" && tar -czf "../../sharpdb-mcp-$VERSION-$rid.tar.gz" .)
            fi
          done

      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}  # nuget.org profile name, NOT email

      - name: Push to NuGet
        run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b
        with:
          files: |
            artifacts/*.nupkg
            artifacts/sharpdb-mcp-*.zip
            artifacts/sharpdb-mcp-*.tar.gz
          generate_release_notes: true
